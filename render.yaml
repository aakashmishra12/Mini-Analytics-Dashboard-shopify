# One service serves the API and the built dashboard from the same origin, so
# there is a single URL to share and no CORS to configure.
#
# The name must keep matching the service already running on Render: blueprint
# entries are matched by name, and renaming one orphans the existing service
# instead of updating it. Note there is deliberately no rootDir, because the
# build has to reach both workspaces.
services:
  - type: web
    name: mini-analytics-api
    runtime: node
    plan: free
    # --include=dev is required: NODE_ENV=production makes npm omit
    # devDependencies, and Vite lives there, so the build would fail without it.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CACHE_TTL_MINUTES
        value: "15"
      # Same origin, so CORS never comes into play. Left permissive in case the
      # frontend is later split onto its own host.
      - key: CORS_ORIGIN
        value: "*"
      # Set to "true" to run the public demo on seeded data instead of a real store.
      - key: USE_MOCK_DATA
        value: "false"
      # Add the real values in the Render dashboard. Never commit them.
      - key: SHOPIFY_STORE_DOMAIN
        sync: false
      - key: SHOPIFY_ADMIN_ACCESS_TOKEN
        sync: false
