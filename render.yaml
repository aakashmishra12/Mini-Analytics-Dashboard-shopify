services:
  - type: web
    name: mini-analytics-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: USE_MOCK_DATA
        value: "true"
      - key: CACHE_TTL_MINUTES
        value: "15"
      # Set to the deployed frontend origin once Vercel is live.
      - key: CORS_ORIGIN
        value: "*"
      # Add these in the Render dashboard, not here.
      - key: SHOPIFY_STORE_DOMAIN
        sync: false
      - key: SHOPIFY_ADMIN_ACCESS_TOKEN
        sync: false
