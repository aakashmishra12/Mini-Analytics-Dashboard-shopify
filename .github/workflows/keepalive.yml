# Free Render instances sleep after 15 minutes idle and then take 30-50 seconds
# to answer the next request. Pinging the health check keeps the dashboard
# responsive for anyone opening the link cold.
#
# GitHub's scheduled runs are best effort and can drift by several minutes, so
# this fires more often than strictly necessary to stay inside the 15 minute
# window. Note GitHub disables scheduled workflows after 60 days without any
# repository activity.
name: Keep the demo awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the health endpoint
        run: |
          for attempt in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              --max-time 90 \
              https://mini-analytics-api.onrender.com/api/health) && true

            if [ "$code" = "200" ]; then
              echo "Awake (HTTP $code) on attempt $attempt."
              exit 0
            fi

            echo "Attempt $attempt returned HTTP $code; retrying."
            sleep 20
          done

          echo "Health check never returned 200."
          exit 1
